name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress production runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # Astro 6 requires Node >=22.12.0 (the action defaults to Node 20).
          node-version: 22
        # Résumé connection (optional). Add these as repo Secrets:
        #   Settings → Secrets and variables → Actions → New repository secret
        env:
          RESUME_APP_URL: ${{ secrets.RESUME_APP_URL }}
          RESUME_TOKEN: ${{ secrets.RESUME_TOKEN }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CONTACT_PHONE: ${{ secrets.CONTACT_PHONE }}
        # If your Astro project is NOT at the repo root, add `path: ./subdir` under `with:` above.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
